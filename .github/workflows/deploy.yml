name: Deploy HRM Backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify package
        run: mvn clean package -DskipTests

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Navigate to backend directory on VPS
            cd /opt/apps/hrm/hr-backend
            
            # Pull latest changes
            git pull origin develop
            
            # Refresh backend service inside Docker Compose
            cd /opt/apps/hrm
            docker compose up -d --build --no-deps hr-backend
            
            # Prune obsolete dangling Docker images
            docker image prune -f
