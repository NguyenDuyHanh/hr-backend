spring:
  application:
    name: hrm
  datasource:
    url: jdbc:postgresql://localhost:5432/hrm
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  main:
    allow-bean-definition-overriding: true

groq:
  api:
    key: ${GROQ_API_KEY:}

jwt:
  expiration: 300000          # 5 phút (5 * 60 * 1000 ms)
  refresh-expiration: 86400000  # 1 ngày (24 * 60 * 60 * 1000 ms)
